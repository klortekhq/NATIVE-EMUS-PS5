name: simpsons-recomp-ps5

on:
  push:
    paths:
      - 'ports/simpsons-recomp-ps5/**'
      - 'tooling/simpsons/**'
      - 'tools/ps5/apply_simpsons_recomp_ps5.py'
      - 'runtime/**'
      - '.github/workflows/simpsons-recomp-ps5.yml'
  pull_request:
    paths:
      - 'ports/simpsons-recomp-ps5/**'
      - 'tooling/simpsons/**'
      - 'tools/ps5/apply_simpsons_recomp_ps5.py'
      - 'runtime/**'
      - '.github/workflows/simpsons-recomp-ps5.yml'
  workflow_dispatch:

concurrency:
  group: simpsons-recomp-ps5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform-cross-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install public PS5 SDK bundle
        run: |
          set -euo pipefail
          wget -q https://github.com/ps5-payload-dev/pacbrew-repo/releases/latest/download/ps5-payload-dev.tar.gz
          sudo tar xf ps5-payload-dev.tar.gz -C /
          test -x /opt/ps5-payload-sdk/bin/prospero-clang++
          ninja --version
          cmake --version

      - name: Fetch pinned Simpsons recomp upstream
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/YesterMester/TheSimpsonsGameRecomp.git /tmp/simpsons-recomp
          git -C /tmp/simpsons-recomp checkout --detach 15feabc95291a7a50851a9a184c5bd78d2dd1f4d

      - name: Cross-compile ReXGlue PS5 platform stack
        env:
          PS5_PAYLOAD_SDK: /opt/ps5-payload-sdk
          SIMPSONS_RECOMP_SRC: /tmp/simpsons-recomp
        run: bash ports/simpsons-recomp-ps5/build_ps5_probe.sh
