name: native-host-smoke

on:
  push:
    paths:
      - 'CMakeLists.txt'
      - 'runtime/**'
      - 'ports/common/**'
      - 'third_party/libretro/**'
      - '.github/workflows/runtime-headers.yml'
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'runtime/**'
      - 'ports/common/**'
      - 'third_party/libretro/**'
      - '.github/workflows/runtime-headers.yml'

jobs:
  host-compile-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure public runtime headers
        run: cmake -S . -B build -DNATIVE_EMUS_BUILD_HEADER_TESTS=ON

      - name: Build public runtime headers
        run: cmake --build build --parallel

      - name: Compile native static-core host
        run: |
          mkdir -p build/smoke
          CXXFLAGS="-std=c++20 -Wall -Wextra -Wpedantic"
          INC="-Iruntime/include -Ithird_party/libretro -Iports/common/libretro-static"
          g++ $CXXFLAGS $INC -c ports/common/libretro-static/native_libretro_host.cpp -o build/smoke/native_libretro_host.o
          g++ $CXXFLAGS $INC -c ports/common/libretro-static/linked_core.cpp -o build/smoke/linked_core.o

      - name: Compile PS5 backend translation units
        run: |
          mkdir -p build/smoke
          CXXFLAGS="-std=c++20 -Wall -Wextra -Wpedantic"
          INC="-Iruntime/include"
          for src in runtime/src/ps5/*.cpp; do
            obj="build/smoke/$(basename "${src%.cpp}").o"
            echo "compile $src -> $obj"
            g++ $CXXFLAGS $INC -c "$src" -o "$obj"
          done
