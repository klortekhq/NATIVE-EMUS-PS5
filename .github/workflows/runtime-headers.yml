name: native-host-smoke

on:
  push:
    paths:
      - 'CMakeLists.txt'
      - 'runtime/**'
      - 'ports/**'
      - 'third_party/libretro/**'
      - 'tools/ps5/**'
      - '.github/workflows/runtime-headers.yml'
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'runtime/**'
      - 'ports/**'
      - 'third_party/libretro/**'
      - 'tools/ps5/**'
      - '.github/workflows/runtime-headers.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-compile-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure runtime and corehost tests
        run: >
          cmake -S . -B build
          -DNATIVE_EMUS_BUILD_HEADER_TESTS=ON
          -DCOREHOST_BUILD_TESTS=ON
          -DPS5RT_BUILD_HOST_PLATFORM_TESTS=ON

      - name: Build runtime and corehost tests
        run: cmake --build build --parallel

      - name: Run runtime and corehost tests
        run: ctest --test-dir build --output-on-failure

      - name: Compile standalone port entry points
        run: |
          mkdir -p build/smoke
          CXXFLAGS="-std=c++20 -Wall -Wextra -Wpedantic"
          INC="-Iruntime/include -Icorehost/include"
          for src in             ports/nes-fceumm/main.cpp             ports/snes9x-ps5/main.cpp             ports/genesis-plus-gx-ps5/main_sg1000.cpp             ports/genesis-plus-gx-ps5/main_mastersystem.cpp             ports/genesis-plus-gx-ps5/main_gamegear.cpp             ports/genesis-plus-gx-ps5/main_megadrive.cpp             ports/freeintv-ps5/main.cpp             ports/o2em-ps5/main.cpp; do
            obj="build/smoke/$(echo "$src" | tr '/.' '__').o"
            g++ $CXXFLAGS $INC -c "$src" -o "$obj"
          done

      - name: Validate all PS5 port scripts
        run: |
          set -euo pipefail
          while IFS= read -r script; do
            echo "bash -n $script"
            bash -n "$script"
          done < <(find ports -name build_ps5.sh -type f | sort)

      - name: Validate pinned Snes9x static core
        run: |
          set -euo pipefail
          PIN=fae2fea08f74180759ef540ee94259213f503480
          SHA=0d4b0c4181d66668ec0040eb17f90a559f7b7fa6cbd9198593c3bdbe79acd029
          mkdir -p build/snes9x
          curl -fL --retry 3 "https://codeload.github.com/libretro/snes9x/tar.gz/$PIN" -o build/snes9x/core.tar.gz
          echo "$SHA  build/snes9x/core.tar.gz" | sha256sum -c -
          tar -xzf build/snes9x/core.tar.gz -C build/snes9x
          CORE="$PWD/build/snes9x/snes9x-$PIN"
          make -C "$CORE/libretro" -f Makefile \
            platform=unix STATIC_LINKING=1 STATIC_LINKING_LINK=1 \
            TARGET="$PWD/build/snes9x/libsnes9x_libretro.a" \
            CC=gcc CXX=g++ AR=ar
          test -s build/snes9x/libsnes9x_libretro.a
          for sym in retro_init retro_deinit retro_load_game retro_run retro_unload_game; do
            nm build/snes9x/libsnes9x_libretro.a | grep -q "[[:space:]]$sym$"
          done

      - name: Validate pinned Genesis Plus GX static core
        run: |
          set -euo pipefail
          PIN=c2838c7dc4236fc2fe94e5dbd08b41486067918e
          SHA=7ba2eab9d6dae71bb42e8208573300ad3475a4263e860178c4d19c36d85fc92b
          mkdir -p build/genesis-plus-gx
          curl -fL --retry 3 "https://codeload.github.com/libretro/Genesis-Plus-GX/tar.gz/$PIN" -o build/genesis-plus-gx/core.tar.gz
          echo "$SHA  build/genesis-plus-gx/core.tar.gz" | sha256sum -c -
          tar -xzf build/genesis-plus-gx/core.tar.gz -C build/genesis-plus-gx
          CORE="$PWD/build/genesis-plus-gx/Genesis-Plus-GX-$PIN"
          make -C "$CORE" -f Makefile.libretro \
            platform=unix STATIC_LINKING=1 \
            TARGET="$PWD/build/genesis-plus-gx/libgenesis_plus_gx_libretro.a" \
            CC=gcc CXX=g++ AR=ar HAVE_CHD=0 HAVE_CDROM=0 FRONTEND_SUPPORTS_RGB565=1
          test -s build/genesis-plus-gx/libgenesis_plus_gx_libretro.a
          for sym in retro_init retro_deinit retro_load_game retro_run retro_unload_game; do
            nm build/genesis-plus-gx/libgenesis_plus_gx_libretro.a | grep -q "[[:space:]]$sym$"
          done

      - name: Validate pinned FCEUmm static core
        run: |
          set -euo pipefail
          PIN=236ccdfc911e84c60fea6b9d0699c2d440a8de14
          SHA=dd002cde9b5271979e0394bb9e696bd37e149ced473ff1e3629cc7fed502381f
          mkdir -p build/fceumm
          curl -fL --retry 3 "https://codeload.github.com/libretro/libretro-fceumm/tar.gz/$PIN" -o build/fceumm/core.tar.gz
          echo "$SHA  build/fceumm/core.tar.gz" | sha256sum -c -
          tar -xzf build/fceumm/core.tar.gz -C build/fceumm
          CORE="build/fceumm/libretro-fceumm-$PIN"
          make -C "$CORE" -f Makefile.libretro \
            platform=unix STATIC_LINKING=1 \
            TARGET="$PWD/build/fceumm/libfceumm_libretro.a" \
            CC=gcc CXX=g++ AR=ar \
            HAVE_HDPACK=0 HAVE_NTSC=1 WANT_32BPP=1
          test -s build/fceumm/libfceumm_libretro.a
          for sym in retro_init retro_deinit retro_load_game retro_run retro_unload_game; do
            nm build/fceumm/libfceumm_libretro.a | grep -q "[[:space:]]$sym$"
          done

      - name: Validate PS1 RADV bundle receipts
        run: python3 tools/ps5/tests/test_radv_bundle.py

      - name: Compile PS5 base backend translation units
        run: |
          set -euo pipefail
          mkdir -p build/smoke
          CXXFLAGS="-std=c++20 -Wall -Wextra -Wpedantic"
          INC="-Iruntime/include"
          for src in \
            runtime/src/ps5/app.cpp \
            runtime/src/ps5/audio.cpp \
            runtime/src/ps5/input.cpp \
            runtime/src/ps5/input_hid.cpp \
            runtime/src/ps5/log.cpp \
            runtime/src/ps5/memory.cpp \
            runtime/src/ps5/vfs.cpp \
            runtime/src/ps5/video.cpp; do
            obj="build/smoke/$(basename "${src%.cpp}").o"
            echo "compile $src -> $obj"
            g++ $CXXFLAGS $INC -c "$src" -o "$obj"
          done
          echo "Optional io_smb.cpp and io_emu_server.cpp are compiled in their dependency-aware gates."

  ps5-cross-build-nes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install public PS5 SDK bundle
        run: |
          set -euo pipefail
          wget -q https://github.com/ps5-payload-dev/pacbrew-repo/releases/latest/download/ps5-payload-dev.tar.gz
          sudo tar xf ps5-payload-dev.tar.gz -C /
          test -x /opt/ps5-payload-sdk/bin/prospero-clang
          test -x /opt/ps5-payload-sdk/bin/prospero-clang++

      - name: Cross-build native NES FCEUmm
        env:
          PS5_PAYLOAD_SDK: /opt/ps5-payload-sdk
        run: |
          bash ports/nes-fceumm/build_ps5.sh
          test -s build/ps5/nes-fceumm/artifacts/nes_fceumm_pie.elf

      - name: Upload native NES build
        uses: actions/upload-artifact@v4
        with:
          name: native-nes-fceumm-ps5-pie
          path: |
            build/ps5/nes-fceumm/artifacts/nes_fceumm_pie.elf
            build/ps5/nes-fceumm/artifacts/SHA256SUMS
          if-no-files-found: error

