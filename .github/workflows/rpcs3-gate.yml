name: rpcs3-ps5-llvm-gate

on:
  push:
    paths:
      - 'tools/ps5/verify_rpcs3_ps5_sources.py'
      - 'ports/rpcs3-ps5/**'
      - '.github/workflows/rpcs3-gate.yml'
  pull_request:
    paths:
      - 'tools/ps5/verify_rpcs3_ps5_sources.py'
      - 'ports/rpcs3-ps5/**'
      - '.github/workflows/rpcs3-gate.yml'
  workflow_dispatch:

concurrency:
  group: rpcs3-ps5-llvm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-abi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install public PS5 SDK bundle
        run: |
          set -euo pipefail
          wget -q https://github.com/ps5-payload-dev/pacbrew-repo/releases/latest/download/ps5-payload-dev.tar.gz
          sudo tar xf ps5-payload-dev.tar.gz -C /
          test -x /opt/ps5-payload-sdk/bin/prospero-clang++

      - name: Fetch pinned PS5 RPCS3 and LLVM
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/mihawk-99/PS5_RPCS3.git /tmp/rpcs3
          git -C /tmp/rpcs3 checkout --detach 2ada8e453c592d8764d2801a667f3da415794918
          git clone --filter=blob:none https://github.com/mihawk-99/PS5_LLVM.git /tmp/llvm
          git -C /tmp/llvm checkout --detach 98b45cc22e98844b7d49bbedefdfee04a740650a
      - name: Verify PPU/SPU LLVM recompiler source gate
        run: python3 "$GITHUB_WORKSPACE/tools/ps5/verify_rpcs3_ps5_sources.py" /tmp/rpcs3 /tmp/llvm

      - name: Generate LLVM configuration headers
        run: |
          set -euo pipefail
          cmake -S /tmp/llvm/llvm -B /tmp/llvm-config -G Ninja             -DLLVM_TARGETS_TO_BUILD=X86             -DLLVM_INCLUDE_TESTS=OFF             -DLLVM_INCLUDE_EXAMPLES=OFF             -DLLVM_INCLUDE_BENCHMARKS=OFF             -DLLVM_ENABLE_TERMINFO=OFF             -DLLVM_ENABLE_ZLIB=OFF             -DLLVM_ENABLE_ZSTD=OFF             -DLLVM_ENABLE_LIBXML2=OFF             -DLLVM_ENABLE_BINDINGS=OFF

      - name: Cross-compile PS5 LLVM ABI header probe
        run: |
          set -euo pipefail
          cat >/tmp/ps5_llvm_abi_probe.cpp <<'EOF'
          #include "llvm/ADT/SmallVector.h"
          #include "llvm/Support/TrailingObjects.h"
          #include <cstddef>

          struct alignas(32) Payload {
            unsigned char bytes[32];
          };

          class Node final : private llvm::TrailingObjects<Node, Payload> {
            friend llvm::TrailingObjects<Node, Payload>;
            int value_{};
            std::size_t numTrailingObjects(
                llvm::TrailingObjects<Node, Payload>::OverloadToken<Payload>) const {
              return 1;
            }
          };

          static_assert(alignof(llvm::SmallVector<Payload, 0>) >= alignof(Payload));
          static_assert(alignof(Node) >= alignof(Payload));

          int ps5_llvm_abi_probe() {
          #if !defined(__SCE__)
          #error prospero-clang++ must define __SCE__
          #endif
            llvm::SmallVector<Payload, 0> values;
            return static_cast<int>(values.size());
          }
          EOF
          /opt/ps5-payload-sdk/bin/prospero-clang++             -std=c++20 -O2 -DNDEBUG             -I/tmp/llvm-config/include             -I/tmp/llvm/llvm/include             -c /tmp/ps5_llvm_abi_probe.cpp             -o /tmp/ps5_llvm_abi_probe.o
          test -s /tmp/ps5_llvm_abi_probe.o

      - name: Fetch pinned RPCS3 AsmJit dependency
        run: |
          set -euo pipefail
          git -C /tmp/rpcs3 submodule update --init --depth 1 3rdparty/asmjit/asmjit
          test -f /tmp/rpcs3/3rdparty/asmjit/asmjit/src/asmjit/asmjit.h

      - name: Cross-compile RPCS3 ASMJIT runtime object
        run: |
          set -euo pipefail
          CXX=/opt/ps5-payload-sdk/bin/prospero-clang++
          flags=(
            -std=c++20 -O2 -DNDEBUG
            -DARCH_X64
            -DRPCS3_LIBRETRO
            -I/tmp/rpcs3
            -I/tmp/rpcs3/rpcs3
            -I/tmp/rpcs3/3rdparty
            -I/tmp/rpcs3/3rdparty/asmjit/asmjit/src
          )
          "$CXX" "${flags[@]}"             -c /tmp/rpcs3/Utilities/JITASM.cpp             -o /tmp/rpcs3_jitasm_ps5.o
          test -s /tmp/rpcs3_jitasm_ps5.o

      - name: Cross-compile RPCS3 SPU ASMJIT recompiler object
        run: |
          set -euo pipefail
          CXX=/opt/ps5-payload-sdk/bin/prospero-clang++
          flags=(
            -std=c++20 -O2 -DNDEBUG
            -DARCH_X64
            -DRPCS3_LIBRETRO
            -I/tmp/rpcs3
            -I/tmp/rpcs3/rpcs3
            -I/tmp/rpcs3/3rdparty
            -I/tmp/rpcs3/3rdparty/asmjit/asmjit/src
          )
          "$CXX" "${flags[@]}"             -c /tmp/rpcs3/rpcs3/Emu/Cell/SPUASMJITRecompiler.cpp             -o /tmp/rpcs3_spu_asmjit_ps5.o
          test -s /tmp/rpcs3_spu_asmjit_ps5.o
